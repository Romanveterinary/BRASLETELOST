name: Build APK

on:
  workflow_dispatch: # Ручний запуск кнопкою

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libreoffice-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" "cython<3.0.0" virtualenv Kivy

    - name: Pre-configure Android SDK and Accept ALL Licenses
      run: |
        # 1. Створюємо структуру папок
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        
        # 2. Завантажуємо офіційні інструменти командного рядка Android
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
        unzip -q tools.zip -d ~/.buildozer/android/platform/android-sdk/
        
        # 3. Розкладаємо файли так, як їх очікує і нова, і стара архітектура Buildozer
        mv ~/.buildozer/android/platform/android-sdk/cmdline-tools/* ~/.buildozer/android/platform/android-sdk/tools/ 2>/dev/null || true
        cp -r ~/.buildozer/android/platform/android-sdk/tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ 2>/dev/null || true
        
        # 4. Прописуємо шлях до інструментів у систему
        export PATH=$PATH:~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:~/.buildozer/android/platform/android-sdk/tools/bin
        
        # 5. КРИТИЧНИЙ РЯДОК: Автоматично підписуємо абсолютно ВСІ ліцензії Google Android SDK
        yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/home/runner/.buildozer/android/platform/android-sdk --licenses || true

    - name: Build APK with Buildozer
      run: |
        # Запускаємо збірку додатку
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VetTrack-AntiLost-APK
        path: bin/*.apk
