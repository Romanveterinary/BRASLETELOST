name: Build APK

on:
  workflow_dispatch: # Дозволяє запускати збірку вручну кнопкою

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/actions-setup-python@v5
      with:
        python-version: '3.11'

    - name: Install platform dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lldb lld bzip2 libbz2-dev libffi-dev libssl-dev tags

    - name: Build with Buildozer
      uses: ArtemGovorov/buildozer-action@v1
      id: buildozer
      with:
        buildozer_version: master
        command: buildozer android debug
        repository_root: .

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: VetTrack-AntiLost-APK
        path: ${{ steps.buildozer.outputs.filename }}
